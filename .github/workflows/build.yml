name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LOGICLIB: "0.2.0"   # read-only dependency, taken from CosmicLogic0/logiclib-paper branch "dist"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Get LogicLib for Paper (read-only dependency)
        run: |
          mkdir -p libs
          curl -fsSL -o "libs/logiclib-paper-${LOGICLIB}.jar" "https://raw.githubusercontent.com/CosmicLogic0/logiclib-paper/dist/logiclib-paper-${LOGICLIB}.jar"
      - name: Build plugin jar
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stashradar-paper-jar
          path: build/libs/*.jar

  # Starts a real Paper server on every target version with Stash Radar + LogicLib, runs the in-game
  # self-test (real chests, barrels and shulker boxes are filled and searched) and checks the log.
  paper-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.12.2", java: 8 }
          - { mc: "1.16.5", java: 11 }
          - { mc: "1.18.2", java: 17 }
          - { mc: "1.19.2", java: 17 }
          - { mc: "1.20.1", java: 17 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    name: paper-test (${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # Temurin's Java 8 download is broken right now (not a gzip file); Zulu ships the same Java 8.
          distribution: ${{ matrix.java == 8 && 'zulu' || 'temurin' }}
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: stashradar-paper-jar
          path: jars
      - name: Download Paper ${{ matrix.mc }}
        run: |
          mkdir -p server/plugins && cd server
          bash ../ci/get-paper.sh "${{ matrix.mc }}"
          find ../jars -name "stashradar-paper-*.jar" ! -name "*-sources.jar" -exec cp {} plugins/ \;
          curl -fsSL -o plugins/logiclib-paper.jar "https://raw.githubusercontent.com/CosmicLogic0/logiclib-paper/dist/logiclib-paper-${LOGICLIB}.jar"
          ls plugins
      - name: Start server and check Stash Radar
        run: |
          chmod +x ci/server-test.sh
          TEST_COMMANDS="stashradar selftest" ci/server-test.sh server \
            "LogicLib for Paper .* running on Minecraft" \
            "Stash Radar .* running on Minecraft" \
            "Stash Radar self-test PASSED" \
            -- java -Xmx1500M -jar paper.jar nogui
      - name: Restart with a 1.0 config.yml (upgrade keeps the owner's choices) and an older LogicLib Plugin
        run: |
          set -o pipefail
          # 1) Same world again with a 1.0-style config: copper chests added, own range kept, still passes.
          printf 'range: 20\nmax-range: 40\ncontainers:\n- CHEST\n- BARREL\nmessages:\n  prefix: "&8[&bMy Radar&8]"\n' > server/plugins/StashRadar/config.yml
          mv server/server.log server/server-first.log
          TEST_COMMANDS="stashradar selftest" ci/server-test.sh server "config.yml updated to version 2" "Stash Radar self-test PASSED" \
            -- java -Xmx1500M -jar paper.jar nogui | tail -3
          python3 - <<'PY'
          import re, sys
          t = open('server/plugins/StashRadar/config.yml').read()
          ok = re.search(r'^range: 20$', t, re.M) and re.search(r'^max-range: 40$', t, re.M) and 'COPPER_CHEST' in t \
               and 'My Radar' in t and re.search(r'^config-version: 2$', t, re.M) and 'glow-through-walls' in t
          print(t[:600]); sys.exit(0 if ok else 1)
          PY
          # 2) LogicLib Plugin 0.1.0: Stash Radar must say it needs 0.2.0 and turn itself off (no errors).
          curl -fsSL -o server/plugins/logiclib-paper.jar "https://raw.githubusercontent.com/CosmicLogic0/logiclib-paper/dist/logiclib-paper-0.1.0.jar"
          mv server/server.log server/server-upgrade.log
          CHECK_PATTERN="xxxx-nothing" ci/server-test.sh server "Stash Radar needs LogicLib Plugin 0.2.0 or newer" \
            -- java -Xmx1500M -jar paper.jar nogui | tail -3
          if grep -Ei "exception|NoSuchMethod|NoClassDef" server/server.log | grep -i stashradar; then echo "::error::errors with the old LogicLib Plugin"; exit 1; fi

  # After every test passes: print the jar's checksum and base64 so Claude
  # (whose workspace can't download artifacts) can take the exact tested jar.
  export:
    needs: [paper-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stashradar-paper-jar
          path: jars
      - name: Print tested jar
        run: |
          for f in $(find jars -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort); do
            echo "JAR $(basename $f) $(stat -c%s $f) $(sha256sum $f | cut -d' ' -f1)"
            echo "B64BEGIN $(basename $f)"; base64 -w 4000 $f; echo "B64END"
          done
